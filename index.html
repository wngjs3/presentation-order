<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표 순서</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#1d1d1f; --muted:#8a8a8e; --accent:#2f6fed; --done:#e9e9ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --card:#1d1d20; --text:#f2f2f4; --muted:#8a8a8e; --accent:#5b8cff; --done:#2a2a2e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:24px; margin:0 0 20px; }
  textarea { width:100%; min-height:140px; padding:12px; border-radius:12px; border:1px solid var(--done); background:var(--card); color:var(--text); font:inherit; resize:vertical; }
  .row { display:flex; gap:8px; margin:12px 0 28px; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 16px; cursor:pointer; background:var(--accent); color:#fff; }
  button.ghost { background:var(--done); color:var(--text); }
  .now { background:var(--card); border-radius:16px; padding:24px; text-align:center; margin-bottom:16px; }
  .now small { color:var(--muted); }
  .now .name { font-size:40px; font-weight:700; margin:8px 0 16px; }
  ol { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
  li { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:12px; padding:12px 14px; }
  li .n { color:var(--muted); width:24px; text-align:right; }
  li label { flex:1; display:flex; align-items:center; gap:12px; cursor:pointer; }
  li input { width:20px; height:20px; }
  .empty { text-align:center; color:var(--muted); padding:24px; }
</style>
</head>
<body>
<main>
  <h1>🎤 발표 순서 뽑기</h1>
  <textarea id="input" placeholder="이름을 줄바꿈이나 쉼표로 구분해서 입력"></textarea>
  <div class="row">
    <button id="shuffle">랜덤 순서 뽑기</button>
    <button id="reset" class="ghost">초기화</button>
  </div>
  <div id="out"></div>
</main>
<script>
  const $ = id => document.getElementById(id);
  let queue = [];
  try { queue = JSON.parse(localStorage.getItem('queue')) || []; $('input').value = localStorage.getItem('names') || ''; } catch {}
  const save = () => { try { localStorage.setItem('queue', JSON.stringify(queue)); localStorage.setItem('names', $('input').value); } catch {} };

  function render() {
    save();
    if (!queue.length) { $('out').innerHTML = '<div class="empty">순서를 뽑아주세요 (또는 모두 발표 완료 🎉)</div>'; return; }
    const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    $('out').innerHTML = `
      <div class="now"><small>지금 발표</small><div class="name">${esc(queue[0])}</div>
        <button onclick="done(0)">발표 완료 ✓</button></div>
      <ol>${queue.map((n, i) => `<li><span class="n">${i + 1}</span>
        <label><input type="checkbox" onchange="done(${i})">${esc(n)}</label></li>`).join('')}</ol>`;
  }
  window.done = i => { queue.splice(i, 1); render(); };

  $('shuffle').onclick = () => {
    queue = $('input').value.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
    for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
    render();
  };
  $('reset').onclick = () => { queue = []; $('input').value = ''; render(); };
  render();
</script>
</body>
</html>
